<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Endereço e redes sociais do MCS Café." />
    <link rel="icon" href="/assets/imagens/logo.png" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <title>MCS Café | Endereço</title>
  </head>
  <body>
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
    <header class="site-header">
      <div class="header-content">
        <a class="brand" href="/" aria-label="MCS Café - página inicial">
          <img src="/assets/imagens/logo.png" width="56" height="56" alt="" />
          <span>MCS <strong>Café</strong></span>
        </a>
        <nav class="navbar" aria-label="Navegação principal">
          <a href="/">Início</a>
          <a href="/paginas/sobre">Sobre</a>
          <a href="/paginas/cardapio">Cardápio</a>
          <a href="/paginas/avaliacoes">Avaliações</a>
          <a href="/paginas/endereco" aria-current="page">Endereço</a>
        </nav>
        <a
          class="cart-link"
          href="/paginas/carrinho"
          aria-label="Abrir carrinho"
        >
          <img src="/assets/icones/carrinho.svg" alt="" />
          <span class="cart-count" data-cart-count>0</span>
        </a>
      </div>
    </header>

    <main id="conteudo" class="page-section">
      <div class="page-container section-heading">
        <p class="eyebrow">Endereço</p>
        <h1>Onde nos encontrar</h1>
      </div>
      <section
        class="page-container address-layout"
        aria-label="Localização do MCS Café"
      >
        <iframe
          title="Mapa do endereço do MCS Café"
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3659.4941062264743!2d-46.68674742379058!3d-23.47870595856242!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94cef9c5eebc05db%3A0x9059e44d58b9761c!2sR.%20Mucug%C3%AA%2C%20127%20-%20Jardim%20Maracana%2C%20S%C3%A3o%20Paulo%20-%20SP%2C%2002839-060!5e0!3m2!1spt-BR!2sbr!4v1779892646990!5m2!1spt-BR!2sbr"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          allowfullscreen
        >
        </iframe>
        <div class="address-layout__content">
          <h2>MCS Café</h2>
          <p>
            Rua Mucugê, 127<br />Jardim Maracanã, São Paulo — SP<br />CEP
            02839-060
          </p>
          <div class="social-list" aria-label="Redes sociais">
            <a
              class="social-link"
              href="https://www.instagram.com/murilo.cs7?igsh=MW1rYjZlc3E0emxuZw=="
              target="_blank"
              rel="noreferrer"
            >
              <img src="/assets/icones/instagram.svg" alt="" />
              Instagram
            </a>
            <span class="social-label">
              <img src="/assets/icones/whatsapp.svg" alt="" />
              WhatsApp em breve
            </span>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="site-footer__content">
        <p>© <span data-current-year>2026</span> MCS Café.</p>
        <div class="site-footer__links">
          <a href="/login">Área administrativa</a>
          <a href="/paginas/endereco">Contato</a>
        </div>
      </div>
    </footer>
    <script src="/assets/js/site.js"></script>
    <script src="/assets/js/carrinho.js"></script>
  </body>
</html>
