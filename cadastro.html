<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Criar conta no MCS Café." />
    <link rel="icon" href="./assets/imagens/logo.png" />
    <link rel="stylesheet" href="./assets/css/base.css" />
    <link rel="stylesheet" href="./assets/css/login.css" />
    <title>MCS Café | Criar conta</title>
  </head>
  <body>
    <main class="login-main">
      <section class="login-card" aria-labelledby="cadastro-title">
        <a class="brand" href="./paginas/index.html" aria-label="Voltar à página inicial do MCS Café">
          <img src="./assets/imagens/logo.png" width="56" height="56" alt="" />
          <span>MCS <strong>Café</strong></span>
        </a>
        <h1 id="cadastro-title">Criar conta</h1>
        <form class="login-form" data-form-cadastro>
          <label>
            Nome
            <input name="nome" type="text" autocomplete="name" maxlength="50" required />
          </label>
          <label>
            E-mail
            <input name="email" type="email" autocomplete="email" placeholder="nome@exemplo.com" maxlength="100" required />
          </label>
          <label>
            Telefone
            <input name="telefone" type="tel" autocomplete="tel" maxlength="20" />
          </label>
          <label>
            Senha
            <input name="senha" type="password" autocomplete="new-password" minlength="8" required />
          </label>
          <label>
            Confirmar senha
            <input name="confirmacao" type="password" autocomplete="new-password" minlength="8" required />
          </label>
          <button class="button" type="submit">Criar conta</button>
          <p class="login-status" data-cadastro-status role="status"></p>
        </form>
        <a class="button button--secondary" href="./login.html">Já tenho conta</a>
      </section>
    </main>
    <script src="./assets/js/cliente-api.js"></script>
    <script src="./assets/js/cadastro.js"></script>
  </body>
</html>
