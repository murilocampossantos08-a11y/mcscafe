<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pedidos do MCS Café." />
    <link rel="icon" href="../assets/img/logo.png" />
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/admin.css" />
    <title>MCS Café | Pedidos</title>
  </head>
  <body class="admin-page">
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
    <header class="site-header admin-header">
      <div class="header-content">
        <a class="brand" href="/" aria-label="MCS Café - site público">
          <img src="../assets/img/logo.png" width="56" height="56" alt="" />
          <span>MCS <strong>Café</strong></span>
        </a>
        <nav class="navbar admin-nav" aria-label="Navegação administrativa">
        <a href="../admin/index.html">Visão geral</a>
        <a href="../admin/pedidos.html" aria-current="page">Pedidos</a>
        <a href="../admin/produtos.html">Produtos</a>
        <a href="../admin/estoque.html">Estoque</a>
        <a href="../admin/funcionarios.html">Funcionários</a>
        <a href="../admin/avaliacoes.html">Avaliações</a>
        </nav>
        <a class="button button--secondary" href="/">Ver site</a>
        <button class="button button--danger" type="button" data-sair>Sair</button>
      </div>
    </header>
    <main id="conteudo" class="page-section">
      <div class="page-container">
        <div class="button-group">
          <div>
            <p class="eyebrow">Atendimento</p>
            <h1>Pedidos</h1>
          </div>
          <label class="admin-filter">
            Filtrar
            <select data-pedidos-filtro>
              <option value="">Todos os status</option>
            </select>
          </label>
          <label class="admin-filter">
            Período
            <select data-pedidos-periodo>
              <option value="hoje">Hoje</option>
              <option value="">Todos</option>
            </select>
          </label>
        </div>
        <p class="admin-notice" data-admin-status role="status">Carregando pedidos…</p>
        <div class="admin-orders" data-pedidos-lista></div>
      </div>
    </main>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/api-cliente.js"></script>
    <script src="../assets/js/admin.js"></script>
  </body>
</html>
