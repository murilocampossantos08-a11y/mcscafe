<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/login.css">
    <link rel="stylesheet" href="./assets/css/base.css" />
    <link rel="icon" href="./assets/imagens/logo.png" />
    <title>Recuperar senha</title>
</head>
<body>
    <main class="login-main">
      <section class="login-card" aria-labelledby="login-title">
        <a
          class="brand"
          href="/"
          aria-label="Voltar à página inicial do MCS Café"
        >
          <img src="./assets/imagens/logo.png" width="56" height="56" alt="" />
          <span>MCS <strong>Café</strong></span>
        </a>
        <h1 id="login-title">Recuperar</h1>
        <form class="login-form" data-demo-login>
          <label>
            E-mail
            <input
              name="email"
              type="email"
              autocomplete="email"
              placeholder="nome@exemplo.com"
              required
            />
          </label>


    <script src="./assets/js/login.js"></script>
</body>
</html>
