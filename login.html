<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Acesso demonstrativo à área administrativa do MCS Café."
    />
    <link rel="icon" href="/assets/imagens/logo.png" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/login.css" />
    <title>MCS Café | Acesso administrativo</title>
  </head>
  <body>
    <main class="login-main">
      <section class="login-card" aria-labelledby="login-title">
        <a
          class="brand"
          href="/"
          aria-label="Voltar à página inicial do MCS Café"
        >
          <img src="/assets/imagens/logo.png" width="56" height="56" alt="" />
          <span>MCS <strong>Café</strong></span>
        </a>
        <h1 id="login-title">Área administrativa</h1>
        <p class="login-notice">
          Esta é uma demonstração visual. Nenhuma conta é autenticada e os dados
          não são enviados para um servidor.
        </p>
        <form class="login-form" data-demo-login>
          <label>
            E-mail
            <input
              name="email"
              type="email"
              autocomplete="email"
              placeholder="nome@exemplo.com"
              required
            />
          </label>
          <label>
            Senha
            <input
              name="senha"
              type="password"
              autocomplete="current-password"
              placeholder="Sua senha"
              required
            />
          </label>
          <label>
            Tipo de acesso
            <select name="perfil">
              <option>Administrador</option>
              <option>Funcionário</option>
              <option>Cliente</option>
            </select>
          </label>
          <button class="button" type="submit">Entrar na demonstração</button>
          <p class="login-status" data-login-status role="status"></p>
        </form>
        <a class="button button--secondary" href="/">Voltar ao site</a>
      </section>
    </main>
    <script src="/assets/js/login.js"></script>
  </body>
</html>
