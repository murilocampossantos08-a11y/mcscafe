<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="stylesheet" href="login_mcs.css">
    <title>Login</title>
</head>

<body>
    <div class="login-box">
        <div class="logo-contraine">
            <h1>MCS CAFÉ</h1>
            <a class="logo">
            <img width="50" height="50" src="./img/logo.png" alt="logo">
            </a>
        </div>
        <p>Faça login para acessar sua conta</p>
        <form>
            <div class="input"><label>E-mail</label><input type="email" placeholder="Digite seu e-mail"></div>

            <div class="input"><label>Senha</label><input type="password" placeholder="Digite sua senha"></div>

            <div class="tipo"><label>
                    <input type="radio" name="t" checked> Cliente</label>

                <label><input type="radio" name="t"> Administrador</label>

                <label><input type="radio" name="t"> Funcionário</label>
            </div>
            <button type="submit">Entrar</button>
            <a href="#">Esqueceu sua senha?</a>
        </form>
    </div>
</body>

</html>
