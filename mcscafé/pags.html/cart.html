<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Carrinho</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/cart.css">
</head>

<body>
    <div class="cart-page">
        <span id="cart-count">0</span>
        <div class="cart-left">
            <h1>Seu Carrinho</h1>
            <div id="lista-carrinho"></div>
            <h2 id="total-carrinho">Total: R$ 0,00</h2>
            <button onclick="finalizarCompra()">Finalizar Compra</button>
        </div>
    </div>
    <a href="../pags/index.html" class="button">Voltar a página inicial</a>

    <footer>
        <a href="#" class="logo">
            <img src="./img/logo.png" width="100px" alt="logo">
        </a>
        <p>© 2026-2026, mcscafé.com, Inc.</p>
    </footer>

    <script>
        let carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];

        // Adiciona produto ao carrinho
        function adicionarCarrinho(nome, preco) {

            const itemExistente = carrinho.find(item => item.nome === nome);

            if (itemExistente) {
                itemExistente.quantidade++;
            } else {
                carrinho.push({
                    nome: nome,
                    preco: preco,
                    quantidade: 1
                });
            }

            localStorage.setItem("carrinho", JSON.stringify(carrinho));

            atualizarCarrinho();

            alert(nome + " adicionado ao carrinho!");
        }

        // Atualiza contador do carrinho
        function atualizarCarrinho() {

            const contador = document.getElementById("cart-count");
            const quantidadeTotal = carrinho.reduce(
                (total, item) => total + item.quantidade,
                0
            );

            contador.innerText = quantidadeTotal;
        }

        // Remove item do carrinho pelo índice
        function removerItem(indice) {

            carrinho.splice(indice, 1);

            localStorage.setItem("carrinho", JSON.stringify(carrinho));

            atualizarCarrinho();
            exibirCarrinho();
        }

        // Exibe os itens do carrinho
        function exibirCarrinho() {

            const lista = document.getElementById("lista-carrinho");
            const totalElemento = document.getElementById("total-carrinho");

            if (!lista) return;

            lista.innerHTML = "";

            let total = 0;

            carrinho.forEach((item, indice) => {

                total += item.preco * item.quantidade;

                lista.innerHTML += `
            <div class="item-carrinho">
                <span>${item.nome} (${item.quantidade}x)</span>
                <span>R$ ${item.preco.toFixed(2)}</span>
                <button onclick="removerItem(${indice})">
                    X
                </button>
            </div>
        `;
            });

            if (totalElemento) {
                totalElemento.innerText = `Total: R$ ${total.toFixed(2)}`;
            }
        }

        // Limpa todo o carrinho
        function limparCarrinho(indice) {
            if (carrinho[indice].quantidade > 1) {
                carrinho[indice].quantidade--;
            } else {
                carrinho.splice(indice, 1);
            }

            localStorage.setItem("carrinho", JSON.stringify(carrinho));
            atualizarCarrinho();
            exibirCarrinho();
        }

        // Finalizar compra
        function finalizarCompra() {

            if (carrinho.length === 0) {
                alert("Seu carrinho está vazio!");
                return;
            }

            alert("Compra finalizada com sucesso!");
            limparCarrinho();
        }

        // Executa quando a página carregar
        document.addEventListener("DOMContentLoaded", () => {
            atualizarCarrinho();
            exibirCarrinho();
        });
    </script>
</body>

</html>
